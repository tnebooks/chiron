[project]
name = "pdf2md"
version = "0.1.0"
description = "Local PDF to Markdown converter (Streamlit + Docling)"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.100",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
