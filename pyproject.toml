[project]
name = "pdf2md"
version = "0.1.0"
description = "Local PDF to Markdown converter (Streamlit + Docling)"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.100",
    "streamlit>=1.38",
    "requests>=2.32",
    "PyGithub>=2.4",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
